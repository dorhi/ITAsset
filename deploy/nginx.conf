server {
    listen 80;
    server_name itasset.sae-a.com;

    # 모든 HTTP 요청을 HTTPS로 강제 리다이렉트
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name itasset.sae-a.com;

    # 와일드카드 인증서 파일 경로 (*.sae-a.com)
    # 서버의 해당 경로에 인증서와 키 파일을 미리 복사해두어야 합니다.
    ssl_certificate /etc/nginx/ssl/sae-a.com.crt;
    ssl_certificate_key /etc/nginx/ssl/sae-a.com.key;

    # SSL 보안 설정 (권장사항)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 프론트엔드 정적 파일 서빙
    location / {
        root /var/www/itasset/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 요청을 Spring Boot (Tomcat)으로 리버스 프록시 (포트 8999)
    location /api/ {
        proxy_pass http://localhost:8999/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
