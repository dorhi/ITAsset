version: '3.8'

services:
  backend:
    container_name: itasset-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - itasset-net
    restart: always

  frontend:
    container_name: itasset-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - itasset-net
    depends_on:
      - backend
    restart: always

networks:
  itasset-net:
    driver: bridge