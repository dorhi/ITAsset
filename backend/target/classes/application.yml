server:
  port: 8999

spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${DB_HOST:db_host_here}:${DB_PORT:db_port_here};databaseName=${DB_NAME:db_name};encrypt=false;trustServerCertificate=true;
    username: ${DB_USER:db_user_here}
    password: ${DB_PASSWORD:db_password_here}
  
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: logs/application.log
  level:
    com.saea.itasset: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
